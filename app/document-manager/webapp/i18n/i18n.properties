# This is the resource bundle for poc.sp.hub.documentmanager
# (Knowledge Base: the curator app for the RAG corpus — see document-manager.md)

#Texts for manifest.json

#XTIT: Application name
appTitle=Knowledge Base

#YDES: Application description
appDescription=Curate the knowledge that grounds AI recommendations

#XBUT: List Report toolbar action opening the file upload dialog
uploadFileAction=Upload File
#XBUT: List Report toolbar action opening the ask/search dialog
askAction=Ask Knowledge Base
#XBUT: List Report toolbar action embedding documents that are not indexed yet
reindexMissingAction=Reindex Missing

#XMSG: A write was refused because the user is not a Knowledge Curator
notCurator=Only Knowledge Curators can change the knowledge base.

# ---- Upload dialog ----------------------------------------------------------

#XTIT: Upload dialog title
uploadDialogTitle=Upload Knowledge File
#XFLD: File picker label
uploadFileLabel=File
#XMSG: Hint under the file picker; {0} = size cap in MB, {1} = accepted extensions
uploadFileHint=Max {0} MB. Supported: {1}. The text is extracted and indexed for AI search.
#XFLD: Category label
uploadCategoryLabel=Category
#XFLD: Title label
uploadTitleLabel=Title
#XFLD: Title placeholder
uploadTitlePlaceholder=Defaults to the file name
#XFLD: Source reference label
uploadSourceRefLabel=Source Reference
#XFLD: Source reference placeholder
uploadSourceRefPlaceholder=e.g. POL-007 — shown as the citation in AI answers
#XBUT: Upload confirm button
uploadConfirmButton=Upload
#XBUT: Cancel
cancelButton=Cancel
#XBUT: Close
closeButton=Close
#XMSG: Upload succeeded and the document is searchable
uploadSuccess=File uploaded and indexed.
#XMSG: Upload stored the file but it could not be indexed; {0} = reason
uploadIndexFailed=The file was uploaded, but it is not searchable yet: {0}\n\nFix the content on the document page (Edit) or upload a different file.
#XMSG: Generic upload failure
uploadFailed=The file could not be uploaded.
#XMSG: The document row exists but the bytes did not arrive; {0} = reason
uploadBinaryFailed=The document was created but its file was not uploaded: {0}\n\nPress Upload again to retry the file.
#XMSG: No file picked
validationNoFile=Choose a file to upload.
#XMSG: No category
validationNoCategory=Choose a category.
#XMSG: No title
validationNoTitle=Enter a title.
#XMSG: Unsupported extension; {0} = list
validationFileTypeUnsupported=This file type is not supported. Supported: {0}. Re-save Excel workbooks as CSV.
#XMSG: File too large; {0} = cap in MB
validationFileTooLarge=The file is larger than {0} MB.

# ---- Ask / search dialog ----------------------------------------------------

#XTIT: Ask dialog title
askDialogTitle=Ask the Knowledge Base
#XFLD: Question label
askQuestionLabel=Question or search text
#XFLD: Question placeholder
askQuestionPlaceholder=e.g. How many quotes do I need for a 20,000 EUR purchase?
#XFLD: Category filter label
askCategoryLabel=Category
#XLST: Category filter option for no filter
askAllCategories=All categories
#XFLD: Number of documents to retrieve
askTopKLabel=Documents
#XBUT: Retrieval test (no AI answer)
askSearchButton=Search
#XBUT: Grounded answer
askAskButton=Ask
#XTIT: Answer heading
askAnswerTitle=Answer
#XMSG: The answer is backed by cited documents
askGrounded=Grounded in the knowledge base
#XMSG: The model could not answer from the corpus
askNotAnswered=Not answered from the knowledge base
#XTIT: Cited documents list
askCitationsTitle=Cited sources
#XTIT: Retrieved documents list (ask mode)
askRetrievedTitle=Documents the answer could use
#XTIT: Retrieved documents list (search mode)
askHitsTitle=Documents RAG would ground on (similarity score)
#XMSG: No documents passed the relevance floor
askNoHits=No sufficiently similar documents found.
#XMSG: Search/ask failed
askFailed=The knowledge base could not be queried.

# ---- Reindex ----------------------------------------------------------------

#XMSG: Reindex finished; {0} = documents embedded
reindexDone={0} document(s) indexed.
#XMSG: Reindex finished with failures; {0} indexed, {1} failed
reindexPartial={0} document(s) indexed, {1} failed. Filter by Search Index = FAILED to see why.
#XMSG: Reindex request failed
reindexFailed=Reindexing failed.

# ---- Object Page: similar documents -----------------------------------------

#XTIT: Section title
similarSectionTitle=Similar Documents
#XMSG: Section explanation
similarSectionHint=The documents AI retrieval ranks closest to this one. Very high similarity usually means duplicate or overlapping knowledge.
#XBUT: Run the similarity search
similarFindButton=Find Similar Documents
#XMSG: No similar documents
similarNoHits=No similar documents found.
#XMSG: Document has nothing to compare
similarNoContent=This document has no title or content to compare.
#XMSG: Similarity search failed
similarFailed=Similar documents could not be loaded.

# Field labels are not here: they live as CDS @title annotations in
# annotations.cds, which cannot reference this webapp bundle (the same
# translatability gap recorded for intake-hub, its TASK-UX.md T3.6).
