_schema-version: '3.2'
ID: poc-sp-hub
version: 1.0.0
description: AI Procurement Assistant — SAP CAP + Fiori on Cloud Foundry

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        # cds build produces gen/srv (Node service) and gen/db (HANA HDI content).
        - npx cds build --production

modules:
  # ---------------------------------------------------------------------------
  # CAP Node.js service (OData V4 + AI pipeline)
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      # More memory shortens Node/CAP startup, which shrinks the window where a
      # cold-started instance 404s the first $metadata request from a Fiori app.
      memory: 1G
      disk-quota: 1G
    build-parameters:
      builder: npm
    properties:
      AI_PROVIDER: destination
      AI_CHAT_MODEL: gpt-4o-mini
      AI_EMBED_MODEL: text-embedding-3-large
      AI_DESTINATION_NAME: GenAIHub
      AI_REDACT_PII: 'true'
    requires:
      - name: poc-sp-hub-db
      - name: poc-sp-hub-auth
      - name: poc-sp-hub-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ---------------------------------------------------------------------------
  # HANA HDI deployer
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: poc-sp-hub-db

  # ---------------------------------------------------------------------------
  # Destination content — registers the "srv-api" destination that each app's
  # xs-app.json routes /api/* to. Consumed by the MANAGED approuter provided by
  # SAP Build Work Zone; there is no standalone approuter module by design.
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-destination-content
    type: com.sap.application.content
    requires:
      - name: poc-sp-hub-destination
        parameters:
          content-target: true
      # Reuse the key the app-content module already creates. Creating a second
      # key here makes the managed router enumerate every app twice.
      - name: poc-sp-hub-html5-repo-host
        parameters:
          service-key:
            name: poc-sp-hub-app-content-poc-sp-hub-html5-repo-host-credentials
      - name: poc-sp-hub-auth
        parameters:
          service-key:
            name: poc-sp-hub-auth-key
      - name: srv-api
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: poc-sp-hub-srv-api
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: poc-sp-hub-auth
              TokenServiceKeyName: poc-sp-hub-auth-key
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
              sap.cloud.service: poc.sp.hub
            - Name: poc-sp-hub-html5-repo-host
              ServiceInstanceName: poc-sp-hub-html5-repo-host
              ServiceKeyName: poc-sp-hub-app-content-poc-sp-hub-html5-repo-host-credentials
              sap.cloud.service: poc.sp.hub
            - Name: poc-sp-hub-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: poc-sp-hub-auth
              ServiceKeyName: poc-sp-hub-auth-key
              sap.cloud.service: poc.sp.hub
    build-parameters:
      no-source: true

  # ---------------------------------------------------------------------------
  # Standalone approuter. Added alongside the managed Work Zone router because
  # the managed one returns an opaque 500 on /api/* with no logs reachable from
  # this space (its logs live in the Work Zone subscription). This module runs in
  # our own space, so `cf logs poc-sp-hub-approuter` shows the real routing and
  # token-exchange errors. Apps are served straight out of the html5-apps-repo
  # via the app-runtime plan, so no UI module needs rebuilding.
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: poc-sp-hub-auth
      - name: poc-sp-hub-destination
      - name: poc-sp-hub-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # ---------------------------------------------------------------------------
  # HTML5 apps deployer — Aggregates the 4 UI zips into a resources folder
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: poc-sp-hub-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - documentmanager.zip
          name: documentmanager
          target-path: resources/
        - artifacts:
            - intakehub.zip
          name: intakehub
          target-path: resources/
        - artifacts:
            - requirementworkspace.zip
          name: requirementworkspace
          target-path: resources/
        - artifacts:
            - sourcingproject.zip
          name: sourcingproject
          target-path: resources/

  # ---------------------------------------------------------------------------
  # Fiori Modules - Explicitly installing devDependencies
  # ---------------------------------------------------------------------------
  - name: documentmanager
    type: html5
    path: app/document-manager
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: intakehub
    type: html5
    path: app/intake-hub
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: requirementworkspace
    type: html5
    path: app/requirement-workspace
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: sourcingproject
    type: html5
    path: app/sourcing-project
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

resources:
  - name: poc-sp-hub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: poc-sp-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: poc-sp-hub-${space}
        tenant-mode: dedicated

  - name: poc-sp-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      # HTML5Runtime_enabled is required for the managed approuter to resolve
      # HTML5.DynamicDestination destinations at runtime.
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: GenAIHub
                Type: HTTP
                URL: https://api.openai.com/v1
                ProxyType: Internet
                Authentication: NoAuthentication
                # The API key is NOT declared here — it is added by hand in the
                # cockpit as an additional property named `apiKey` (read by
                # srv/ai/llm-client.js resolveDestination), so no secret is
                # committed to git.
            # `ignore` (not `update`) so redeploys leave the hand-maintained
            # GenAIHub destination — and its apiKey property — untouched. With
            # `update`, every deploy would overwrite it back to the keyless
            # definition above and all AI calls would start failing with 401.
            existing_destinations_policy: ignore

  - name: poc-sp-hub-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # Runtime plan for the STANDALONE approuter (poc-sp-hub-approuter) to read the
  # deployed UI bundles out of the html5-apps-repo. The managed Work Zone router
  # brings its own runtime and does not use this; both can coexist.
  - name: poc-sp-hub-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime 