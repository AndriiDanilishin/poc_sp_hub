_schema-version: '3.2'
ID: poc-sp-hub
version: 1.0.0
description: AI Procurement Assistant — SAP CAP + Fiori on Cloud Foundry

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        # cds build produces gen/srv (Node service) and gen/db (HANA HDI content).
        - npx cds build --production

modules:
  # ---------------------------------------------------------------------------
  # CAP Node.js service (OData V4 + AI pipeline)
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm
    properties:
      AI_PROVIDER: destination
      AI_CHAT_MODEL: gpt-4o-mini
      AI_EMBED_MODEL: text-embedding-3-large
      AI_DESTINATION_NAME: GenAIHub
      AI_REDACT_PII: 'true'
    requires:
      - name: poc-sp-hub-db
      - name: poc-sp-hub-auth
      - name: poc-sp-hub-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ---------------------------------------------------------------------------
  # HANA HDI deployer
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: poc-sp-hub-db

  # ---------------------------------------------------------------------------
  # Managed approuter
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 512M
      memory: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: poc-sp-hub-auth
      - name: poc-sp-hub-html5-repo-runtime

  # ---------------------------------------------------------------------------
  # HTML5 apps deployer — Aggregates the 4 UI zips into a resources folder
  # ---------------------------------------------------------------------------
  - name: poc-sp-hub-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: poc-sp-hub-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - documentmanager.zip
          name: documentmanager
          target-path: resources/
        - artifacts:
            - intakehub.zip
          name: intakehub
          target-path: resources/
        - artifacts:
            - requirementworkspace.zip
          name: requirementworkspace
          target-path: resources/
        - artifacts:
            - sourcingproject.zip
          name: sourcingproject
          target-path: resources/

  # ---------------------------------------------------------------------------
  # Fiori Modules - Explicitly installing devDependencies
  # ---------------------------------------------------------------------------
  - name: documentmanager
    type: html5
    path: app/document-manager
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: intakehub
    type: html5
    path: app/intake-hub
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: requirementworkspace
    type: html5
    path: app/requirement-workspace
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

  - name: sourcingproject
    type: html5
    path: app/sourcing-project
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install --include=dev
        - npm run build:cf
      supported-platforms: []

resources:
  - name: poc-sp-hub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: poc-sp-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: poc-sp-hub-${space}
        tenant-mode: dedicated

  - name: poc-sp-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            destinations:
              - Name: GenAIHub
                Type: HTTP
                URL: https://api.openai.com/v1
                ProxyType: Internet
                Authentication: NoAuthentication
                # Replace with real values (e.g. OAuth2ClientCredentials) once
                # you point AI_PROVIDER at a live provider instead of "mock".
            existing_destinations_policy: update

  - name: poc-sp-hub-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: poc-sp-hub-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime 